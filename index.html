<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stromverbrauch</title>
<meta name="description" content="Stromverbrauch der Wohnung: Zählerstände, Verlauf und geschätzter Jahresverbrauch.">
<meta name="theme-color" content="#163452">
<!-- Kein Web-App-Manifest: sonst würde der Home-Bildschirm den Start-Link ohne #k=… verwenden -->
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23163452'/%3E%3Cpath d='M18 4 8 18h7l-2 10 11-15h-7z' fill='%23f5c84c'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --page: #f3f4f1;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #6d6b66;
    --grid: #e6e5df;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.09);
    --brand: #163452;
    --brand-ink: #ffffff;
    --brand-ink-2: rgba(255, 255, 255, 0.78);
    --seg-bg: #ecebe6;
    --seg-on: #ffffff;
    --c-blau: #2a78d6;
    --c-orange: #eb6834;
    --c-tuerkis: #1baf7a;
    --c-gelb: #eda100;
    --c-violett: #6250d6;
    --bar-neutral: #c4c2ba;
    --bar-neutral-2: #8f8d86;
    --good: #0ca30c;
    --good-ink: #006300;
    --warn: #fab219;
    --bad-ink: #c23434;
    --tip-bg: #ffffff;
    --shadow: 0 1px 2px rgba(11, 11, 11, 0.04), 0 4px 16px rgba(11, 11, 11, 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --muted: #9a9891;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.09);
      --brand: #10263d;
      --seg-bg: #262624;
      --seg-on: #3d3d3a;
      --c-blau: #3987e5;
      --c-orange: #d95926;
      --c-tuerkis: #199e70;
      --c-gelb: #c98500;
      --c-violett: #9085e9;
      --bar-neutral: #4a4945;
      --bar-neutral-2: #77756f;
      --good-ink: #0ca30c;
      --bad-ink: #e66767;
      --tip-bg: #262624;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #9a9891;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.09);
    --brand: #10263d;
    --seg-bg: #262624;
    --seg-on: #3d3d3a;
    --c-blau: #3987e5;
    --c-orange: #d95926;
    --c-tuerkis: #199e70;
    --c-gelb: #c98500;
    --c-violett: #9085e9;
    --bar-neutral: #4a4945;
    --bar-neutral-2: #77756f;
    --good-ink: #0ca30c;
    --bad-ink: #e66767;
    --tip-bg: #262624;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
  header.top { background: var(--brand); color: var(--brand-ink); padding: 16px 0 14px; }
  header.top h1 { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; }
  header.top p { margin: 3px 0 0; font-size: 13.5px; color: var(--brand-ink-2); }
  main.wrap { padding-top: 16px; padding-bottom: 32px; display: grid; gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; min-width: 0; }
  .card h2 { margin: 0; font-size: 16px; font-weight: 650; }
  .card .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .card-head { margin-bottom: 12px; }
  .duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 720px) { .duo { grid-template-columns: minmax(0, 1fr); } }

  /* Eingabe */
  .form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 10px; }
  .form label { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }
  .form input {
    width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--page);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; min-height: 46px;
  }
  .form input:focus { outline: 2px solid var(--c-blau); outline-offset: 0; }
  .form input.num { font-weight: 650; font-variant-numeric: tabular-nums; }
  .btn {
    grid-column: 1 / -1; border: 0; border-radius: 10px; min-height: 46px; font: inherit; font-size: 16px; font-weight: 650;
    background: var(--c-blau); color: #fff; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .meldung { margin: 10px 0 0; font-size: 13.5px; min-height: 1.2em; color: var(--ink-2); }
  .meldung.ok { color: var(--good-ink); }
  .meldung.fehler { color: var(--bad-ink); }
  .leise { margin: 0; font-size: 13.5px; color: var(--muted); }

  /* Schätzung */
  .eyebrow { margin: 0 0 4px; font-size: 13px; color: var(--ink-2); font-weight: 550; }
  .hero { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 8px; margin: 0 0 4px; }
  .hero-value { font-size: 46px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; }
  .hero-unit { font-size: 18px; font-weight: 600; color: var(--ink-2); }
  .note { margin: 0; font-size: 13.5px; color: var(--ink-2); }
  .note + .note { margin-top: 4px; }

  /* Diagramme */
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--ink-2); margin: 0 0 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; width: 14px; height: 2px; border-radius: 2px; flex: none; }
  .legend i.box { width: 10px; height: 10px; border-radius: 3px; }
  .legend i.box.light { opacity: 0.45; }
  .key { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .chart { position: relative; width: 100%; outline: none; }
  .chart:focus-visible { box-shadow: 0 0 0 2px var(--c-blau); border-radius: 8px; }
  .chart svg { display: block; overflow: visible; }
  .chart text { font-family: inherit; }
  .t-axis { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .t-lbl-b { font-size: 12px; fill: var(--ink); font-weight: 650; }
  .t-val { font-size: 12px; fill: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .t-muted { font-size: 11.5px; fill: var(--muted); }
  .gridline { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
  .baseline { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
  .xhair { stroke: var(--ink-2); stroke-width: 1; opacity: 0.55; pointer-events: none; }
  .marker-line { stroke: var(--muted); stroke-width: 1; shape-rendering: crispEdges; }
  .tip {
    position: absolute; z-index: 5; display: none; pointer-events: none; background: var(--tip-bg); color: var(--ink);
    border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.14);
    padding: 8px 10px; font-size: 12.5px; line-height: 1.35; min-width: 150px; max-width: 280px;
  }
  .tip-t { color: var(--ink-2); font-size: 12px; margin-bottom: 4px; }
  .tip-r { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .tip-r i { display: inline-block; width: 12px; height: 2px; border-radius: 2px; flex: none; }
  .tip-r b { font-weight: 650; font-variant-numeric: tabular-nums; }
  .tip-r span { color: var(--ink-2); }
  .tip-n { color: var(--muted); font-size: 11.5px; margin-top: 4px; white-space: normal; }

  /* Historie */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 8px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  th:last-child, td:last-child { padding-right: 0; }
  th { font-weight: 600; color: var(--ink-2); font-size: 12.5px; vertical-align: bottom; }
  th small { display: block; font-weight: 450; color: var(--muted); font-size: 11.5px; }
  td.dim { color: var(--muted); }
  tr.grp td { padding: 0; border-bottom: 1px solid var(--grid); white-space: normal; }
  tr.grp button {
    width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: var(--page); color: var(--ink);
    font: inherit; font-size: 14px; font-weight: 650; text-align: left; padding: 10px 8px; cursor: pointer; flex-wrap: wrap;
  }
  tr.grp button .n { font-weight: 450; color: var(--muted); font-size: 12.5px; }
  tr.grp button .pfeil { margin-left: auto; color: var(--muted); transition: transform 0.15s; }
  tr.grp button[aria-expanded="true"] .pfeil { transform: rotate(180deg); }
  .x { border: 0; background: none; color: var(--muted); font: inherit; font-size: 12.5px; cursor: pointer; padding: 2px 0 2px 6px; text-decoration: underline; }
  @media (max-width: 480px) { table { font-size: 13px; } th, td { padding: 8px 5px; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>Stromverbrauch</h1>
    <p id="stand"></p>
  </div>
</header>

<main class="wrap">
  <div class="duo">
    <section class="card" aria-labelledby="h-eingabe">
      <div class="card-head"><h2 id="h-eingabe">Zählerstand eintragen</h2></div>
      <div id="eingabe"></div>
    </section>
    <section class="card" aria-labelledby="h-schaetzung">
      <p class="eyebrow" id="h-schaetzung">Geschätzter Jahresverbrauch</p>
      <div class="hero"><span class="hero-value" id="hr">–</span><span class="hero-unit">kWh</span></div>
      <p class="note" id="hr-n"></p>
      <p class="note" id="hr-alt"></p>
    </section>
  </div>

  <section class="card" aria-labelledby="h-verlauf">
    <div class="card-head">
      <h2 id="h-verlauf">Verbrauch pro Tag</h2>
      <p class="sub">Ø kWh pro Tag zwischen zwei Ablesungen</p>
    </div>
    <div class="legend" id="lg-verlauf"></div>
    <div class="chart" id="ch-verlauf" tabindex="0" role="img" aria-label="Stufendiagramm: durchschnittlicher Verbrauch pro Tag zwischen den Ablesungen. Die Werte stehen auch in der Historie."></div>
  </section>

  <section class="card" aria-labelledby="h-jahre">
    <div class="card-head">
      <h2 id="h-jahre">Verbrauch pro Jahr</h2>
      <p class="sub">kWh je Kalenderjahr, angefangene Jahre hochgerechnet</p>
    </div>
    <div class="legend" id="lg-jahre"></div>
    <div class="chart" id="ch-jahre" tabindex="0" role="img" aria-label="Säulendiagramm: Verbrauch je Kalenderjahr. Die Werte stehen auch in der Historie."></div>
  </section>

  <section class="card" aria-labelledby="h-historie">
    <div class="card-head"><h2 id="h-historie">Historie</h2></div>
    <table>
      <thead><tr><th scope="col">Datum</th><th scope="col">Zählerstand<small>kWh</small></th><th scope="col">Verbrauch<small>kWh</small></th><th scope="col">pro Tag<small>kWh</small></th></tr></thead>
      <tbody id="historie"></tbody>
    </table>
  </section>
</main>

<script src="messwerte.js"></script>
<script>
(function () {
  'use strict';
  var API = 'https://stromverbrauch.fbw159.workers.dev';
  var D = window.STROM;
  if (!D) { document.getElementById('stand').textContent = 'messwerte.js fehlt'; return; }

  /* ---------- Formatierung ---------- */
  var NFS = {};
  function nf(d) { return NFS[d] || (NFS[d] = new Intl.NumberFormat('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d })); }
  function fmt(x, d) { return (x == null || !isFinite(x)) ? '–' : nf(d || 0).format(x); }
  var DAY = 864e5;
  function dnum(iso) { var p = iso.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / DAY; }
  function dobj(n) { return new Date(Math.round(n) * DAY); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fdate(n) { var t = dobj(n); return pad(t.getUTCDate()) + '.' + pad(t.getUTCMonth() + 1) + '.' + t.getUTCFullYear(); }
  function iso(n) { var t = dobj(n); return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate()); }
  function mstart(y, m) { return Date.UTC(y, m, 1) / DAY; }
  function yearOf(n) { return dobj(n).getUTCFullYear(); }
  function monthOf(n) { return dobj(n).getUTCMonth(); }
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); return node; }
  function heuteIso() { var t = new Date(); return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate()); }

  /* ---------- Daten ---------- */
  var FARBVAR = { blau: '--c-blau', orange: '--c-orange', 'türkis': '--c-tuerkis', gelb: '--c-gelb', violett: '--c-violett' };
  var W, CUR, PREV, TOT, OFFEN;
  function aufbereiten() {
    W = D.wohnungen.map(function (w) {
      var r = D.ablesungen.filter(function (a) { return a.wohnung === w.name; })
        .map(function (a) { return { t: dnum(a.datum), datum: a.datum, stand: a.stand }; })
        .sort(function (a, b) { return a.t - b.t; });
      return Object.assign({}, w, { r: r, col: 'var(' + (FARBVAR[w.farbe] || '--c-blau') + ')' });
    }).filter(function (w) { return w.r.length > 0; })
      .sort(function (a, b) { return a.r[0].t - b.r[0].t; });
    CUR = W[W.length - 1];
    PREV = W.length > 1 ? W[W.length - 2] : null;
    TOT = {}; W.forEach(function (w) { TOT[w.name] = totals(w); });
    OFFEN = D.offenLokal || [];
  }
  function totals(w) {
    if (w.r.length < 2) return null;
    var a = w.r[0], b = w.r[w.r.length - 1], tage = b.t - a.t, kwh = b.stand - a.stand;
    return tage > 0 ? { von: a.t, bis: b.t, tage: tage, kwh: kwh, proTag: kwh / tage, hr: kwh / tage * 365 } : null;
  }
  function mergedIntervals(w) {          // Intervalle unter 3 Tagen mit dem Folgeintervall zusammenfassen
    var out = [], start = w.r[0];
    for (var i = 1; i < w.r.length; i++) {
      var b = w.r[i];
      if (b.t - start.t >= 3 || i === w.r.length - 1) {
        var tage = b.t - start.t;
        if (tage > 0) out.push({ von: start.t, bis: b.t, tage: tage, kwh: b.stand - start.stand, proTag: (b.stand - start.stand) / tage });
        start = b;
      }
    }
    return out;
  }
  function standAt(w, t) {
    var r = w.r;
    if (t <= r[0].t) return r[0].stand;
    if (t >= r[r.length - 1].t) return r[r.length - 1].stand;
    var lo = 0, hi = r.length - 1;
    while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (r[mid].t <= t) lo = mid; else hi = mid; }
    var a = r[lo], b = r[hi];
    return a.stand + (b.stand - a.stand) * (t - a.t) / (b.t - a.t);
  }
  function years(w) {
    var out = [];
    if (w.r.length < 2) return out;
    var first = w.r[0].t, last = w.r[w.r.length - 1].t;
    for (var y = yearOf(first); y <= yearOf(last); y++) {
      var ys = mstart(y, 0), ye = mstart(y + 1, 0), von = Math.max(ys, first), bis = Math.min(ye, last), tage = bis - von;
      if (tage <= 0) continue;
      var kwh = standAt(w, bis) - standAt(w, von);
      out.push({ w: w, y: y, tage: tage, kwh: kwh, proTag: kwh / tage, hr: kwh / tage * 365, abdeckung: tage / (ye - ys), voll: tage >= ye - ys });
    }
    return out;
  }

  /* ---------- SVG- und Diagramm-Helfer ---------- */
  var NS = 'http://www.w3.org/2000/svg';
  function s(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function stext(parent, x, y, txt, cls, anchor, extra) {
    var t = s('text', Object.assign({ x: x, y: y, class: cls || 't-axis', 'text-anchor': anchor || 'start' }, extra || {}), parent);
    t.textContent = txt; return t;
  }
  function niceTicks(lo, hi, count) {
    if (hi <= lo) hi = lo + 1;
    var step0 = (hi - lo) / (count || 4), mag = Math.pow(10, Math.floor(Math.log10(step0))), norm = step0 / mag;
    var step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
    var a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, ticks = [];
    for (var v = a; v <= b + step / 1e6; v += step) ticks.push(Math.round(v / step) * step);
    return { lo: a, hi: b, step: step, ticks: ticks };
  }
  function frame(host, o) {
    var tip = host.querySelector('.tip');
    clear(host);
    var w = Math.max(280, host.clientWidth || 600), h = o.height || 240;
    var svg = s('svg', { width: w, height: h, viewBox: '0 0 ' + w + ' ' + h }, host);
    if (!tip) tip = el('div', 'tip');
    tip.style.display = 'none';
    host.appendChild(tip);
    return { svg: svg, w: w, h: h, x0: o.padL, x1: w - o.padR, y0: h - o.padB, y1: o.padT, tip: tip, host: host };
  }
  function gridY(F, T, ys, fmtFn) {
    var g = s('g', {}, F.svg);
    T.ticks.forEach(function (v) {
      var y = Math.round(ys(v)) + 0.5;
      s('line', { x1: F.x0, x2: F.x1, y1: y, y2: y, class: v === 0 ? 'baseline' : 'gridline' }, g);
      stext(g, F.x0 - 7, y + 3.5, fmtFn(v), 't-axis', 'end');
    });
    return g;
  }
  function showTip(F, px, py, title, rows, note) {
    var t = F.tip; clear(t);
    if (title) t.appendChild(el('div', 'tip-t', title));
    rows.forEach(function (r) {
      var row = el('div', 'tip-r');
      if (r.color) { var k = el('i', r.dash ? 'dash' : ''); if (r.dash) k.style.borderTopColor = r.color; else k.style.background = r.color; row.appendChild(k); }
      row.appendChild(el('b', '', r.value));
      if (r.label) row.appendChild(el('span', '', r.label));
      t.appendChild(row);
    });
    if (note) t.appendChild(el('div', 'tip-n', note));
    t.style.display = 'block';
    var tw = t.offsetWidth, th = t.offsetHeight, left = px + 14;
    if (left + tw > F.w - 2) left = px - 14 - tw;
    if (left < 0) left = Math.max(0, Math.min(F.w - tw, px - tw / 2));
    var top = Math.max(0, Math.min(F.h - th, py - th / 2));
    t.style.left = left + 'px'; t.style.top = top + 'px';
  }
  function hideTip(F) { F.tip.style.display = 'none'; }
  function hover(F, opts) {   // opts.items: [{x, ...}], opts.show(i) -> {title, rows, note, y}
    var g = s('g', {}, F.svg);
    var line = s('line', { x1: 0, x2: 0, y1: F.y1, y2: F.y0, class: 'xhair', visibility: 'hidden' }, g);
    var hit = s('rect', { x: F.x0 - 6, y: 0, width: F.x1 - F.x0 + 12, height: F.h, fill: 'transparent' }, g);
    var cur = -1;
    function set(i) {
      if (i < 0) { line.setAttribute('visibility', 'hidden'); hideTip(F); cur = -1; if (opts.onClear) opts.onClear(); return; }
      cur = i; var it = opts.items[i];
      if (opts.crosshair !== false) { line.setAttribute('x1', it.x); line.setAttribute('x2', it.x); line.setAttribute('visibility', 'visible'); }
      var c = opts.show(i);
      showTip(F, it.x, c.y != null ? c.y : (F.y1 + F.y0) / 2, c.title, c.rows, c.note);
    }
    function nearest(px) {
      var best = -1, bd = 1e9;
      opts.items.forEach(function (it, i) {
        var d = (it.x0 != null && px >= it.x0 && px <= it.x1) ? 0 : Math.abs(it.x - px);
        if (d < bd) { bd = d; best = i; }
      });
      return best;
    }
    hit.addEventListener('pointermove', function (e) {
      var r = F.svg.getBoundingClientRect();
      set(nearest((e.clientX - r.left) * F.w / r.width));
    });
    hit.addEventListener('pointerleave', function () { set(-1); });
    F.host.onkeydown = function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        e.preventDefault();
        var i = cur < 0 ? (e.key === 'ArrowRight' ? 0 : opts.items.length - 1) : cur + (e.key === 'ArrowRight' ? 1 : -1);
        set(Math.max(0, Math.min(opts.items.length - 1, i)));
      } else if (e.key === 'Escape') set(-1);
    };
    F.host.onblur = function () { set(-1); };
    return g;
  }
  function legend(id, items) {
    var host = clear($(id));
    items.forEach(function (it) {
      var sp = el('span');
      var k = el('i', it.box ? 'box' + (it.light ? ' light' : '') : (it.dash ? 'dash' : ''));
      if (it.dash) k.style.color = it.color; else k.style.background = it.color;
      sp.appendChild(k); sp.appendChild(document.createTextNode(it.label));
      host.appendChild(sp);
    });
  }
  function timeTicksYears(t0, t1) {
    var out = [];
    for (var y = yearOf(t0); y <= yearOf(t1) + 1; y++) { var t = mstart(y, 0); if (t >= t0 && t <= t1) out.push({ t: t, label: String(y) }); }
    return out;
  }


  /* ---------- Kopf & Schätzung ---------- */
  function renderKopf() {
    var l = CUR.r[CUR.r.length - 1];
    $('stand').textContent = CUR.name + ' · zuletzt ' + fmt(l.stand, 1) + ' kWh am ' + fdate(l.t);
    var tc = TOT[CUR.name], tp = PREV ? TOT[PREV.name] : null;
    $('hr').textContent = tc ? fmt(tc.hr, 0) : '–';
    $('hr-n').textContent = tc ? 'Ø ' + fmt(tc.proTag, 1) + ' kWh pro Tag, gemessen seit ' + fdate(tc.von) : 'Ab der zweiten Ablesung gibt es eine Schätzung.';
    $('hr-alt').textContent = tp ? 'Alte Wohnung (' + PREV.name + '): ≈ ' + fmt(tp.hr, 0) + ' kWh pro Jahr' : '';
  }

  /* ---------- Diagramm: Verlauf ---------- */
  function drawVerlauf() {
    var host = $('ch-verlauf');
    var F = frame(host, { height: 250, padL: 34, padR: 10, padT: 26, padB: 26 });
    var tAll = []; W.forEach(function (w) { w.r.forEach(function (r) { tAll.push(r.t); }); });
    var t0 = Math.min.apply(null, tAll), t1 = Math.max.apply(null, tAll), pd = Math.max(5, (t1 - t0) * 0.012);
    t0 -= pd; t1 += pd;
    var xs = function (t) { return F.x0 + (t - t0) / (t1 - t0) * (F.x1 - F.x0); };
    var steps = W.map(function (w) { return { w: w, iv: mergedIntervals(w) }; });
    var maxV = 1; steps.forEach(function (st) { st.iv.forEach(function (i) { maxV = Math.max(maxV, i.proTag); }); });
    var T = niceTicks(0, maxV * 1.12, 4);
    var ys = function (v) { return F.y0 - v / T.hi * (F.y0 - F.y1); };
    var gb = s('g', {}, F.svg);
    W.forEach(function (w) {
      var a = xs(w.r[0].t), b = xs(w.r[w.r.length - 1].t);
      s('rect', { x: a, y: F.y1, width: Math.max(1, b - a), height: F.y0 - F.y1, fill: w.col, 'fill-opacity': 0.07 }, gb);
    });
    gridY(F, T, ys, function (v) { return fmt(v, 0); });
    stext(F.svg, F.x0 - 7, F.y1 - 12, 'kWh/Tag', 't-axis', 'end');
    for (var i = 1; i < W.length; i++) {
      var ga = xs(W[i - 1].r[W[i - 1].r.length - 1].t), gbx = xs(W[i].r[0].t);
      if (gbx - ga > 112) stext(F.svg, (ga + gbx) / 2, F.y0 - 10, 'keine Ablesungen', 't-muted', 'middle');
    }
    var span = yearOf(t1) - yearOf(t0);
    for (var y = yearOf(t0); y <= yearOf(t1) + 1; y++) {
      var tt = mstart(y, 0); if (tt < t0 || tt > t1) continue;
      var x = Math.round(xs(tt)) + 0.5;
      s('line', { x1: x, x2: x, y1: F.y0, y2: F.y0 + 4, class: 'baseline' }, F.svg);
      stext(F.svg, x + 3, F.y0 + 17, String(y), 't-axis', 'start');
    }
    if (span === 0) stext(F.svg, F.x0, F.y0 + 17, String(yearOf(t0)), 't-axis', 'start');
    var items = [];
    steps.forEach(function (st) {
      var d = '';
      st.iv.forEach(function (iv, k) {
        var xa = xs(iv.von), xb = xs(iv.bis), yy = ys(iv.proTag);
        d += (k === 0 ? 'M' : 'L') + xa.toFixed(1) + ',' + yy.toFixed(1) + 'L' + xb.toFixed(1) + ',' + yy.toFixed(1);
        items.push({ x: (xa + xb) / 2, x0: xa, x1: xb, iv: iv, w: st.w, y: yy });
      });
      s('path', { d: d, fill: 'none', stroke: st.w.col, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, F.svg);
      var lastIv = st.iv[st.iv.length - 1];
      if (lastIv) s('circle', { cx: xs(lastIv.bis), cy: ys(lastIv.proTag), r: 4, fill: st.w.col, stroke: 'var(--surface)', 'stroke-width': 2 }, F.svg);
    });
    items.sort(function (a, b) { return a.x - b.x; });
    hover(F, {
      items: items,
      show: function (k) {
        var it = items[k], iv = it.iv;
        return { y: it.y, title: fdate(iv.von) + ' – ' + fdate(iv.bis),
          rows: [{ color: it.w.col, value: fmt(iv.proTag, 2) + ' kWh/Tag', label: it.w.name }],
          note: fmt(iv.kwh, 1) + ' kWh in ' + fmt(iv.tage) + ' Tagen' };
      }
    });
    legend('lg-verlauf', W.slice().reverse().map(function (w) { var t = TOT[w.name]; return { color: w.col, label: w.name + (t ? ' (Ø ' + fmt(t.proTag, 1) + ')' : '') }; }));
  }

  /* ---------- Diagramm: Jahre ---------- */
  function drawJahre() {
    var host = $('ch-jahre');
    var F = frame(host, { height: 230, padL: 42, padR: 8, padT: 26, padB: 26 });
    var ys_ = []; W.forEach(function (w) { years(w).forEach(function (y) { ys_.push(y); }); });
    if (!ys_.length) return;
    var T = niceTicks(0, Math.max.apply(null, ys_.map(function (y) { return y.hr; })) * 1.12, 4);
    var ys = function (v) { return F.y0 - v / T.hi * (F.y0 - F.y1); };
    gridY(F, T, ys, function (v) { return fmt(v, 0); });
    stext(F.svg, F.x0 - 7, F.y1 - 12, 'kWh', 't-axis', 'end');
    var bw = (F.x1 - F.x0) / ys_.length, barW = Math.min(24, bw * 0.55);
    var items = [];
    ys_.forEach(function (y, i) {
      var cx = F.x0 + bw * (i + 0.5), top = ys(y.hr), h = F.y0 - top, r = Math.min(4, h / 2), x = cx - barW / 2;
      var d = 'M' + x + ',' + F.y0 + 'V' + (top + r) + 'Q' + x + ',' + top + ' ' + (x + r) + ',' + top + 'H' + (x + barW - r) +
        'Q' + (x + barW) + ',' + top + ' ' + (x + barW) + ',' + (top + r) + 'V' + F.y0 + 'Z';
      s('path', { d: d, fill: y.w.col, 'fill-opacity': y.voll ? 1 : 0.45 }, F.svg);
      stext(F.svg, cx, top - 6, fmt(y.hr, 0), 't-val', 'middle');
      stext(F.svg, cx, F.y0 + 17, y.y + (y.voll ? '' : '*'), 't-axis', 'middle');
      items.push({ x: cx, x0: cx - bw / 2, x1: cx + bw / 2, y: y, top: top });
    });
    hover(F, {
      items: items, crosshair: false,
      show: function (k) {
        var y = items[k].y;
        return { y: items[k].top, title: y.y + ' · ' + y.w.name,
          rows: [{ color: y.w.col, value: fmt(y.hr, 0) + ' kWh', label: y.voll ? 'gemessen' : 'hochgerechnet' }],
          note: fmt(y.kwh, 0) + ' kWh in ' + fmt(y.tage) + ' Tagen · Ø ' + fmt(y.proTag, 1) + ' kWh/Tag' };
      }
    });
    var lg = W.slice().reverse().map(function (w) { return { color: w.col, label: w.name, box: true }; });
    lg.push({ color: 'var(--ink-2)', label: '* angefangenes Jahr', box: true, light: true });
    legend('lg-jahre', lg);
  }

  /* ---------- Historie ---------- */
  var ALT_OFFEN = false;
  function renderHistorie() {
    var tb = clear($('historie'));
    W.slice().reverse().forEach(function (w, idx) {
      var zeilen = [];
      for (var i = w.r.length - 1; i >= 0; i--) {
        var r = w.r[i], p = i > 0 ? w.r[i - 1] : null, tage = p ? r.t - p.t : 0;
        var tr = el('tr');
        var td0 = el('td', '', fdate(r.t));
        if (w === CUR && OFFEN.indexOf(r.datum) >= 0 && KEY) {
          var x = el('button', 'x', 'löschen'); x.type = 'button'; x.dataset.datum = r.datum; x.title = 'Eintrag löschen';
          td0.appendChild(x);
        }
        tr.appendChild(td0);
        tr.appendChild(el('td', '', fmt(r.stand, 1)));
        tr.appendChild(el('td', p ? '' : 'dim', p ? fmt(r.stand - p.stand, 1) : '–'));
        tr.appendChild(el('td', p && tage > 0 ? '' : 'dim', p && tage > 0 ? fmt((r.stand - p.stand) / tage, 1) : '–'));
        zeilen.push(tr);
      }
      if (idx === 0) { zeilen.forEach(function (z) { tb.appendChild(z); }); return; }
      var g = el('tr', 'grp'), c = el('td'); c.colSpan = 4;
      var b = el('button'); b.type = 'button'; b.setAttribute('aria-expanded', ALT_OFFEN ? 'true' : 'false');
      var k = el('span', 'key'); k.style.background = w.col; b.appendChild(k);
      b.appendChild(el('span', '', w.name));
      b.appendChild(el('span', 'n', (w.kurz || 'früher') + ' · ' + w.r.length + ' Ablesungen'));
      b.appendChild(el('span', 'pfeil', '▾'));
      b.addEventListener('click', function () { ALT_OFFEN = !ALT_OFFEN; renderHistorie(); });
      c.appendChild(b); g.appendChild(c); tb.appendChild(g);
      if (ALT_OFFEN) zeilen.forEach(function (z) { tb.appendChild(z); });
    });
  }

  /* ---------- Zugang & Speichern ----------
     Der Zugangscode bleibt als #k=… in der Adresse (Lesezeichen und Home-Bildschirm behalten ihn)
     und wird zusätzlich im Browser gemerkt, damit auch der kurze Link zum Eintragen reicht. */
  var SPEICHER = 'strom-schluessel';
  function codeAusAdresse() { var m = location.hash.match(/(?:^#|&)k=([A-Za-z0-9_-]+)/); return m ? m[1] : null; }
  function codeInAdresse(k) {
    var soll = k ? '#k=' + k : '';
    if (location.hash !== soll) history.replaceState(null, '', location.pathname + location.search + soll);
  }
  function merke(k) { try { if (k) localStorage.setItem(SPEICHER, k); else localStorage.removeItem(SPEICHER); } catch (e) { /* egal */ } }
  var KEY = codeAusAdresse();
  if (!KEY) { try { KEY = localStorage.getItem(SPEICHER); } catch (e) { KEY = null; } }
  if (KEY) { merke(KEY); codeInAdresse(KEY); }

  function api(method, pfad, body) {
    return fetch(API + pfad, {
      method: method, cache: 'no-store',
      headers: Object.assign({ 'x-key': KEY }, body ? { 'content-type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { j._status = r.status; return j; });
    }, function () { return { _status: 0, fehler: 'Speicher gerade nicht erreichbar – bitte später noch einmal.' }; });
  }
  function zugangWeg() {
    KEY = null; merke(null); codeInAdresse(null); renderEingabe(); renderHistorie();
  }
  function parseStand(txt) {
    var t = String(txt).trim().replace(/\s|kWh/gi, '');
    if (!t) return NaN;
    if (t.indexOf(',') >= 0) t = t.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
    return /^\d+(\.\d+)?$/.test(t) ? parseFloat(t) : NaN;
  }
  function meldung(text, art) { var m = $('meldung'); if (!m) return; m.textContent = text || ''; m.className = 'meldung' + (art ? ' ' + art : ''); }
  function pruefeLokal(datum, stand) {
    if (!datum) return 'Bitte ein Datum wählen.';
    if (datum > heuteIso()) return 'Das Datum liegt in der Zukunft.';
    if (!isFinite(stand) || stand <= 0) return 'Bitte den Zählerstand als Zahl eingeben, z. B. 60.512,3.';
    var t = dnum(datum), vor = null, nach = null;
    CUR.r.forEach(function (r) { if (r.t < t) vor = r; else if (r.t > t && !nach) nach = r; });
    if (vor && stand < vor.stand) return 'Kleiner als der Stand vom ' + fdate(vor.t) + ' (' + fmt(vor.stand, 1) + ' kWh).';
    if (nach && stand > nach.stand) return 'Größer als der Stand vom ' + fdate(nach.t) + ' (' + fmt(nach.stand, 1) + ' kWh).';
    if (vor && t > vor.t && (stand - vor.stand) / (t - vor.t) > 60) return 'Das wären ' + fmt((stand - vor.stand) / (t - vor.t), 1) + ' kWh pro Tag – bitte prüfen.';
    return null;
  }
  function uebernehmen(daten) { D = daten; window.STROM = daten; aufbereiten(); alles(); }
  function speichern(ersetzen) {
    var datum = $('in-datum').value, stand = parseStand($('in-stand').value);
    var f = pruefeLokal(datum, stand);
    if (f) { meldung(f, 'fehler'); return; }
    var btn = $('in-btn'); btn.disabled = true; meldung('Speichere …');
    api('POST', '/ablesung', { datum: datum, stand: stand, ersetzen: !!ersetzen }).then(function (j) {
      btn.disabled = false;
      if (j._status === 200 && j.daten) {
        uebernehmen(j.daten);
        meldung('Gespeichert: ' + fmt(stand, 1) + ' kWh am ' + fdate(dnum(datum)) + '.', 'ok');
        $('in-stand').value = '';
        return;
      }
      if (j._status === 401) { zugangWeg(); return; }
      if (j._status === 409 && j.vorhanden != null && !ersetzen) {
        if (confirm((j.fehler || 'Für diesen Tag gibt es schon einen Wert.') + ' Durch ' + fmt(stand, 1) + ' kWh ersetzen?')) speichern(true);
        else meldung('Nicht gespeichert.');
        return;
      }
      meldung(j.fehler || 'Speichern nicht möglich.', 'fehler');
    });
  }
  function loeschen(datum) {
    if (!confirm('Eintrag vom ' + fdate(dnum(datum)) + ' löschen?')) return;
    meldung('Lösche …');
    api('DELETE', '/ablesung', { datum: datum }).then(function (j) {
      if (j._status === 200 && j.daten) { uebernehmen(j.daten); meldung('Eintrag vom ' + fdate(dnum(datum)) + ' gelöscht.', 'ok'); }
      else if (j._status === 401) zugangWeg();
      else meldung(j.fehler || 'Löschen nicht möglich.', 'fehler');
    });
  }
  function renderEingabe() {
    var host = clear($('eingabe'));
    if (!KEY) {
      host.appendChild(el('p', 'leise', 'Zum Eintragen den persönlichen Link mit Zugangscode öffnen. Neue Stände kommen sonst per Zählerfoto dazu.'));
      return;
    }
    var l = CUR.r[CUR.r.length - 1];
    var form = el('form', 'form'); form.noValidate = true;
    var l1 = el('label', '', 'Datum'), i1 = el('input'); i1.type = 'date'; i1.id = 'in-datum'; i1.value = heuteIso(); i1.max = heuteIso(); l1.appendChild(i1);
    var l2 = el('label', '', 'Zählerstand in kWh'), i2 = el('input', 'num'); i2.type = 'text'; i2.id = 'in-stand'; i2.inputMode = 'decimal';
    i2.autocomplete = 'off'; i2.placeholder = 'z. B. ' + fmt(l.stand, 1); l2.appendChild(i2);
    var b = el('button', 'btn', 'Speichern'); b.type = 'submit'; b.id = 'in-btn';
    form.appendChild(l1); form.appendChild(l2); form.appendChild(b);
    form.addEventListener('submit', function (e) { e.preventDefault(); speichern(false); });
    host.appendChild(form);
    host.appendChild(el('p', 'meldung', 'Zuletzt ' + fmt(l.stand, 1) + ' kWh am ' + fdate(l.t) + '.')).id = 'meldung';
  }
  $('historie').addEventListener('click', function (e) {
    var b = e.target.closest('button.x'); if (b) loeschen(b.dataset.datum);
  });
  window.addEventListener('hashchange', function () {
    var k = codeAusAdresse();
    if (k && k !== KEY) { KEY = k; merke(k); pruefeZugang(); }
    else if (KEY) codeInAdresse(KEY);
  });
  function pruefeZugang() {
    renderEingabe(); renderHistorie();
    if (!KEY) return;
    api('GET', '/status').then(function (j) {
      if (j._status === 401) { zugangWeg(); return; }
      if (j._status === 200 && j.daten && j.daten.ablesungen && j.daten.ablesungen.length >= D.ablesungen.length) {
        var vorher = JSON.stringify(D.ablesungen);
        if (JSON.stringify(j.daten.ablesungen) !== vorher || JSON.stringify(j.daten.offenLokal || []) !== JSON.stringify(D.offenLokal || [])) {
          var m = $('meldung') ? $('meldung').textContent : '';
          uebernehmen(j.daten); meldung(m);
        }
      } else if (j._status !== 200) meldung(j.fehler || 'Speicher gerade nicht erreichbar.', 'fehler');
    });
  }

  /* ---------- Start ---------- */
  function alles() { renderKopf(); drawVerlauf(); drawJahre(); renderHistorie(); }
  aufbereiten();
  alles();
  renderEingabe();
  pruefeZugang();
  var lastW = window.innerWidth, timer = null;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth; clearTimeout(timer); timer = setTimeout(function () { drawVerlauf(); drawJahre(); }, 120);
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { drawVerlauf(); drawJahre(); });
})();
</script>
</body>
</html>
